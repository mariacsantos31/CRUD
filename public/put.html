<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Usuário | SONORA</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="admin-page">
  <header class="topbar admin-topbar">
    <a class="brand" href="boas-vindas.html">SONORA</a>
    <nav class="topnav">
      <a class="btn secondary small" href="boas-vindas.html">Início</a>
      <a class="btn secondary small" href="get.html">Listar (GET)</a>
      <a class="btn secondary small" href="delete.html">Apagar (DELETE)</a>
      <button class="btn secondary small" id="btnSair">Sair</button>
    </nav>
  </header>
  <main class="container admin-container">
    <div class="section-title">
      <div class="eyebrow">ATUALIZAR CADASTRO</div>
      <h1>Editar usuário por CPF</h1>
      <p class="subtitle">Busque o usuário pelo CPF para alterar os dados cadastrais.</p>
    </div>
    <section class="panel">
      <div class="panel-head">
        <h2>Buscar cadastro</h2>
        <div class="searchbar">
          <input id="buscaCpf" aria-label="Buscar por CPF">
          <button class="btn" id="btnBuscar">Buscar</button>
        </div>
      </div>
      <div id="mensagem" class="notice"></div>
      <form id="formEdicao" class="hidden">
        <input type="hidden" id="editId">
        <div class="form-grid">
          <div class="field"><label for="editNome">Nome</label><input id="editNome" required></div>
          <div class="field"><label for="editSobrenome">Sobrenome</label><input id="editSobrenome" required></div>
          <div class="field"><label for="editCpf">CPF</label><input id="editCpf" required></div>
          <div class="field"><label for="editTelefone">Telefone</label><input id="editTelefone" required></div>
          <div class="field"><label for="editEmail">E-mail</label><input id="editEmail" type="email" required></div>
          <div class="field"><label for="editSenha">Senha</label><input id="editSenha" required></div>
          <div class="field"><label for="editCep">CEP</label><input id="editCep" required></div>
          <div class="field"><label for="editRua">Rua</label><input id="editRua" required></div>
          <div class="field"><label for="editCidade">Cidade</label><input id="editCidade" required></div>
          <div class="field"><label for="editEstado">Estado</label><input id="editEstado" required></div>
        </div>
        <button class="btn" type="submit">Salvar alterações</button>
      </form>
    </section>
  </main>
  <script src="put.js"></script>
</body>
</html>
